name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        snapfind "train ticket" returned nothing, but the screenshot is in the folder.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: Paste the full output. Please remove any private text from your screenshots first.
      render: text
  - type: input
    id: version
    attributes:
      label: snapfind version
      placeholder: snapfind --version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
