name: Feature request
description: Suggest something snapfind should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find or do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Keep in mind snapfind must stay fully offline.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
