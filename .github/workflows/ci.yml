name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # The socket-patch test only sees Python's socket module. This job runs the same test in a
  # Linux network namespace with no interfaces, so native code (onnxruntime, OpenCV) can't
  # reach the network either.
  offline-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest with no network namespace
        run: |
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" \
            SNAPFIND_EXPECT_NO_NET=1 python -m pytest -q tests/test_offline.py
