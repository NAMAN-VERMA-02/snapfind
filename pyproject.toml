[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snapfind"
version = "0.1.0"
description = "Search your screenshots by the text in them. Runs fully offline on your own machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naman Verma" }]
requires-python = ">=3.10"
dependencies = [
  "rapidocr==3.10.*",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "numpy>=1.24",
]
keywords = ["ocr", "screenshots", "search", "offline", "sqlite", "fts5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
snapfind = "snapfind.cli:main"

[project.urls]
Homepage = "https://github.com/NAMAN-VERMA-02/snapfind"
Issues = "https://github.com/NAMAN-VERMA-02/snapfind/issues"

[tool.setuptools]
packages = ["snapfind"]

[tool.setuptools.package-data]
snapfind = ["model/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML/CSS and eval screen data read better unwrapped.
"snapfind/web.py" = ["E501"]
"eval/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
